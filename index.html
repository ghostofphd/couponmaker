const nameEl=document.querySelector('#name'),dateEl=document.querySelector('#date'),stampCount=document.querySelector('#stampCount'),couponNameEl=document.querySelector('#couponName'),benefit1El=document.querySelector('#benefit1'),benefit2El=document.querySelector('#benefit2'),bgUpload=document.querySelector('#bgUpload'),stampUpload=document.querySelector('#stampUpload'),lineColorEl=document.querySelector('#lineColor'),showTitleLineEl=document.querySelector('#showTitleLine'),titleColorEl=document.querySelector('#titleColor'),bodyColorEl=document.querySelector('#bodyColor'),guideStyleEl=document.querySelector('#guideStyle'),guideColorEl=document.querySelector('#guideColor'),stampStyleEl=document.querySelector('#stampStyle'),fontUpload=document.querySelector('#fontUpload');
let couponFont="KoPubBatang,serif",fontObjectUrl=null;
const slots=[{x:300,y:665},{x:660,y:665},{x:1020,y:665},{x:1380,y:665},{x:1740,y:665},{x:300,y:920},{x:660,y:920},{x:1020,y:920},{x:1380,y:920},{x:1740,y:920}];
let marked=Array(10).fill(false);
const defaultPositions={title:{x:1024,y:165},name:{x:190,y:390},date:{x:1120,y:390},stamps:{x:1020,y:792.5}};
let positions=JSON.parse(JSON.stringify(defaultPositions));
let dragging=null,selectedElement=null,dragOffset={x:0,y:0},suppressClick=false,positionsLocked=false;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);dateEl.value=today();
stamp.onload=()=>{stampReady=true;draw()};stamp.src=stampSrc;
function fittedText(text,maxWidth,startSize,weight=700){let size=startSize;ctx.font=`${weight} ${size}px ${couponFont}`;while(size>28&&ctx.measureText(text).width>maxWidth){size-=2;ctx.font=`${weight} ${size}px ${couponFont}`} return size}
function formatDate(v){if(!v)return '';const[y,m,d]=v.split('-');return `${y}. ${m}. ${d}.`}
function drawCover(img){const cw=canvas.width,ch=canvas.height,ir=img.width/img.height,cr=cw/ch;let sx=0,sy=0,sw=img.width,sh=img.height;if(ir>cr){sw=img.height*cr;sx=(img.width-sw)/2}else{sh=img.width/cr;sy=(img.height-sh)/2}ctx.drawImage(img,sx,sy,sw,sh,0,0,cw,ch)}function drawStamp(img,x,y,size,style){
 ctx.save();
 if(style==='original'){
  const scale=Math.min(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;
  ctx.drawImage(img,x-w/2,y-h/2,w,h);
 }else{
  const side=Math.min(img.width,img.height),sx=(img.width-side)/2,sy=(img.height-side)/2;
  if(style==='circle'){ctx.beginPath();ctx.arc(x,y,size/2,0,Math.PI*2);ctx.clip()}
  ctx.drawImage(img,sx,sy,side,side,x-size/2,y-size/2,size,size);
 }
 ctx.restore();
}
function benefitText(text,x,y){if(!text)return;ctx.save();ctx.fillStyle=bodyColorEl.value;ctx.textAlign='center';ctx.textBaseline='middle';let chars=[...text],lines=chars.length>5?[chars.slice(0,Math.ceil(chars.length/2)).join(''),chars.slice(Math.ceil(chars.length/2)).join('')]:[text];let size=52;ctx.font=`700 ${size}px ${couponFont}`;while(size>32&&Math.max(...lines.map(v=>ctx.measureText(v).width))>220){size-=2;ctx.font=`700 ${size}px ${couponFont}`} lines.forEach((line,i)=>ctx.fillText(line,x,y+(i-(lines.length-1)/2)*(size+7)));ctx.restore()}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(bgReady) drawCover(bg); else {ctx.fillStyle='#f8fbfa';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.save();ctx.fillStyle='rgba(16,94,88,.06)';for(let y=0;y<canvas.height;y+=64)for(let x=0;x<canvas.width;x+=64)if((x/64+y/64)%2===0)ctx.fillRect(x,y,64,64);ctx.restore()}
 const title=couponNameEl.value.trim()||'대학원생 글커미션';ctx.fillStyle=titleColorEl.value;ctx.textAlign='center';ctx.textBaseline='alphabetic';fittedText(title,1650,86);ctx.fillText(title,positions.title.x,positions.title.y);
 if(showTitleLineEl.checked){ctx.strokeStyle=lineColorEl.value;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(positions.title.x-634,positions.title.y+60);ctx.lineTo(positions.title.x+634,positions.title.y+60);ctx.stroke();}
 ctx.textAlign='start';ctx.textBaseline='middle';ctx.font=`400 48px ${couponFont}`;ctx.fillStyle=bodyColorEl.value;
 const nameText=nameEl.value.trim()||'이름을 입력해주세요',dateText=formatDate(dateEl.value)||'날짜를 입력해주세요';
 ctx.fillText('신청인',positions.name.x,positions.name.y);ctx.fillText(nameText,positions.name.x+200,positions.name.y);
 ctx.fillText('발행일자',positions.date.x,positions.date.y);ctx.fillText(dateText,positions.date.x+270,positions.date.y);
 const guide=guideStyleEl.value;ctx.save();ctx.strokeStyle=guideColorEl.value;ctx.globalAlpha=.55;ctx.lineWidth=4;ctx.setLineDash([16,14]);slots.forEach((p,i)=>{if(guide==='circle'){ctx.beginPath();ctx.arc(p.x,p.y,118,0,Math.PI*2);ctx.stroke()}else if(guide==='square'){ctx.strokeRect(p.x-118,p.y-118,236,236)}});ctx.restore();
 benefitText(benefit1El.value.trim(),slots[4].x,slots[4].y);benefitText(benefit2El.value.trim(),slots[9].x,slots[9].y);
 if(stampReady)marked.forEach((on,i)=>{if(on){const sz=235;ctx.globalAlpha=.96;drawStamp(stamp,slots[i].x,slots[i].y,sz,stampStyleEl.value);ctx.globalAlpha=1}});
 if(selectedElement)drawSelectionBox(selectedElement);
 stampCount.value=marked.filter(Boolean).length;
}
function setCount(n){n=Math.max(0,Math.min(10,Number(n)||0));marked=marked.map((_,i)=>i<n);draw()}
[nameEl,dateEl,couponNameEl,benefit1El,benefit2El,lineColorEl,titleColorEl,bodyColorEl,guideStyleEl,guideColorEl,stampStyleEl,showTitleLineEl].forEach(el=>el.addEventListener('input',draw));stampCount.addEventListener('input',e=>setCount(e.target.value));
function loadImageFile(input,target,isBg){const file=input.files&&input.files[0];if(!file)return;const url=URL.createObjectURL(file);target.onload=()=>{if(isBg)bgReady=true;else stampReady=true;draw();URL.revokeObjectURL(url)};target.src=url}
bgUpload.addEventListener('change',()=>loadImageFile(bgUpload,bg,true));stampUpload.addEventListener('change',()=>loadImageFile(stampUpload,stamp,false));
fontUpload.addEventListener('change',async()=>{const file=fontUpload.files&&fontUpload.files[0];if(!file)return;if(fontObjectUrl)URL.revokeObjectURL(fontObjectUrl);fontObjectUrl=URL.createObjectURL(file);try{const face=new FontFace('CouponCustomFont',`url(${fontObjectUrl})`);await face.load();document.fonts.add(face);couponFont="'CouponCustomFont', KoPubBatang, serif";draw()}catch(e){alert('TTF 폰트를 불러오지 못했어. 다른 TTF 파일을 사용해줘.');fontUpload.value=''}});
document.querySelector('#minus').onclick=()=>setCount(marked.filter(Boolean).length-1);document.querySelector('#plus').onclick=()=>setCount(marked.filter(Boolean).length+1);
const resetBackgroundBtn=document.querySelector('#resetBackground'),resetStampBtn=document.querySelector('#resetStamp'),resetPositionsBtn=document.querySelector('#resetPositions'),positionLockBtn=document.querySelector('#togglePositionLock');
resetBackgroundBtn.onclick=()=>{bgUpload.value='';bg.src='';bgReady=false;draw()};
resetStampBtn.onclick=()=>{stampUpload.value='';stampReady=false;stamp.onload=()=>{stampReady=true;draw()};stamp.src=stampSrc;draw()};
function resetPositionsOnly(){positions=JSON.parse(JSON.stringify(defaultPositions));const resetSlots=[{x:300,y:665},{x:660,y:665},{x:1020,y:665},{x:1380,y:665},{x:1740,y:665},{x:300,y:920},{x:660,y:920},{x:1020,y:920},{x:1380,y:920},{x:1740,y:920}];slots.forEach((p,i)=>{p.x=resetSlots[i].x;p.y=resetSlots[i].y});selectedElement=null;dragging=null;draw()}
resetPositionsBtn.onclick=resetPositionsOnly;
positionLockBtn.onclick=()=>{positionsLocked=!positionsLocked;selectedElement=null;dragging=null;positionLockBtn.classList.toggle('active',positionsLocked);positionLockBtn.textContent=positionsLocked?'위치 잠금 해제':'위치 잠금';canvas.style.cursor=positionsLocked?'pointer':'pointer';draw()};
document.querySelector('#resetSettings').onclick=()=>{couponNameEl.value='대학원생 글커미션';benefit1El.value='5자 이내';benefit2El.value='5자 이내';nameEl.value='';dateEl.value=today();lineColorEl.value='#105e58';showTitleLineEl.checked=true;titleColorEl.value='#105e58';bodyColorEl.value='#105e58';guideStyleEl.value='circle';guideColorEl.value='#105e58';stampStyleEl.value='original';bgUpload.value='';stampUpload.value='';fontUpload.value='';couponFont='KoPubBatang,serif';if(fontObjectUrl){URL.revokeObjectURL(fontObjectUrl);fontObjectUrl=null}bgReady=false;stamp.src=stampSrc;marked=Array(10).fill(false);positions=JSON.parse(JSON.stringify(defaultPositions));
const resetSlots=[{x:300,y:665},{x:660,y:665},{x:1020,y:665},{x:1380,y:665},{x:1740,y:665},{x:300,y:920},{x:660,y:920},{x:1020,y:920},{x:1380,y:920},{x:1740,y:920}];
slots.forEach((p,i)=>{p.x=resetSlots[i].x;p.y=resetSlots[i].y});selectedElement=null;draw()};
function canvasPoint(e){
 const r=canvas.getBoundingClientRect();
 return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};
}
function elementAt(x,y){
 // 제목: 실제 제목 폭을 기준으로 넉넉한 드래그 영역
 ctx.save();fittedText(couponNameEl.value.trim()||'대학원생 글커미션',1650,86);
 const tw=Math.min(1650,ctx.measureText(couponNameEl.value.trim()||'대학원생 글커미션').width);ctx.restore();
 if(x>=positions.title.x-tw/2-45&&x<=positions.title.x+tw/2+45&&y>=positions.title.y-100&&y<=positions.title.y+85)return 'title';
 // 신청인/이름 묶음
 ctx.save();ctx.font=`400 48px ${couponFont}`;
 const nw=200+ctx.measureText(nameEl.value.trim()||'이름을 입력해주세요').width;ctx.restore();
 if(x>=positions.name.x-25&&x<=positions.name.x+nw+30&&y>=positions.name.y-55&&y<=positions.name.y+55)return 'name';
 // 발행일자/날짜 묶음
 ctx.save();ctx.font=`400 48px ${couponFont}`;
 const dw=270+ctx.measureText(formatDate(dateEl.value)||'날짜를 입력해주세요').width;ctx.restore();
 if(x>=positions.date.x-25&&x<=positions.date.x+dw+30&&y>=positions.date.y-55&&y<=positions.date.y+55)return 'date';
 // 도장 영역: 각 원 내부는 도장 찍기/지우기를 위해 제외하고, 원 바깥 여백만 이동 영역으로 사용
 const inStampArea=x>=145&&x<=1895&&y>=520&&y<=1065;
 const inStampCircle=slots.some(slot=>Math.hypot(x-slot.x,y-slot.y)<135);
 if(inStampArea&&!inStampCircle)return 'stamps';
 return null;
}
function selectionBounds(key){
 if(key==='stamps'){
  const xs=slots.map(p=>p.x),ys=slots.map(p=>p.y),pad=150;
  return {x:Math.min(...xs)-pad,y:Math.min(...ys)-pad,w:Math.max(...xs)-Math.min(...xs)+pad*2,h:Math.max(...ys)-Math.min(...ys)+pad*2};
 }
 ctx.save();ctx.font=`400 48px ${couponFont}`;
 if(key==='title'){
  fittedText(couponNameEl.value.trim()||'대학원생 글커미션',1650,86);
  const w=Math.min(1650,ctx.measureText(couponNameEl.value.trim()||'대학원생 글커미션').width)+70;
  ctx.restore();
  return {x:positions.title.x-w/2,y:positions.title.y-100,w,h:showTitleLineEl.checked?180:130};
 }
 if(key==='name'){
  const w=200+ctx.measureText(nameEl.value.trim()||'이름을 입력해주세요').width+55;ctx.restore();
  return {x:positions.name.x-28,y:positions.name.y-58,w,h:116};
 }
 const w=270+ctx.measureText(formatDate(dateEl.value)||'날짜를 입력해주세요').width+55;ctx.restore();
 return {x:positions.date.x-28,y:positions.date.y-58,w,h:116};
}
function drawSelectionBox(key){
 const b=selectionBounds(key);
 ctx.save();ctx.strokeStyle='#105e58';ctx.lineWidth=3;ctx.setLineDash([12,10]);
 ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.restore();
}
canvas.addEventListener('pointerdown',e=>{
 if(positionsLocked)return;
 const p=canvasPoint(e),hit=elementAt(p.x,p.y);
 if(!hit)return;
 selectedElement=hit;draw();
 dragging=hit;dragOffset.x=p.x-positions[hit].x;dragOffset.y=p.y-positions[hit].y;
 suppressClick=false;canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';canvas.focus();e.preventDefault();
});
canvas.addEventListener('pointermove',e=>{
 const p=canvasPoint(e);
 if(positionsLocked){canvas.style.cursor='pointer';return}
 if(dragging){
  const nx=p.x-dragOffset.x,ny=p.y-dragOffset.y;
  if(Math.hypot(nx-positions[dragging].x,ny-positions[dragging].y)>2)suppressClick=true;
  // 요소가 완전히 캔버스 밖으로 빠지지 않도록 기본 여백 유지
  if(dragging==='stamps'){
   const minX=Math.min(...slots.map(p=>p.x)),maxX=Math.max(...slots.map(p=>p.x));
   const minY=Math.min(...slots.map(p=>p.y)),maxY=Math.max(...slots.map(p=>p.y));
   const dx=Math.max(150-minX,Math.min(canvas.width-150-maxX,nx-positions.stamps.x));
   const dy=Math.max(150-minY,Math.min(canvas.height-150-maxY,ny-positions.stamps.y));
   slots.forEach(p=>{p.x+=dx;p.y+=dy});positions.stamps.x+=dx;positions.stamps.y+=dy;
  }else{
   positions[dragging].x=Math.max(40,Math.min(canvas.width-40,nx));
   positions[dragging].y=Math.max(70,Math.min(canvas.height-50,ny));
  }
  draw();return;
 }
 canvas.style.cursor=elementAt(p.x,p.y)?'grab':'pointer';
});
function endDrag(e){
 if(!dragging)return;
 dragging=null;
 try{canvas.releasePointerCapture(e.pointerId)}catch(_){}
 const p=canvasPoint(e);canvas.style.cursor=elementAt(p.x,p.y)?'grab':'pointer';
}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('pointerleave',()=>{if(!dragging)canvas.style.cursor='pointer'});
canvas.addEventListener('click',e=>{
 if(suppressClick){suppressClick=false;return}
 const p=canvasPoint(e);
 // 선택된 텍스트를 다시 클릭하면 선택 유지, 빈 곳/도장 영역 클릭 시 선택 해제
 if(!positionsLocked&&elementAt(p.x,p.y))return;
 if(selectedElement){selectedElement=null;draw()}
 let best=-1,dist=Infinity;slots.forEach((slot,i)=>{const d=Math.hypot(p.x-slot.x,p.y-slot.y);if(d<dist){dist=d;best=i}});
 if(best>=0&&dist<135){marked[best]=!marked[best];draw()}
});

canvas.addEventListener('keydown',e=>{
 if(positionsLocked)return;
 if(!selectedElement||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;
 e.preventDefault();
 const p=positions[selectedElement];
 let dx=0,dy=0;
 if(e.key==='ArrowLeft')dx=-1;
 if(e.key==='ArrowRight')dx=1;
 if(e.key==='ArrowUp')dy=-1;
 if(e.key==='ArrowDown')dy=1;
 if(selectedElement==='stamps'){
  const minX=Math.min(...slots.map(v=>v.x)),maxX=Math.max(...slots.map(v=>v.x));
  const minY=Math.min(...slots.map(v=>v.y)),maxY=Math.max(...slots.map(v=>v.y));
  if(minX+dx<150||maxX+dx>canvas.width-150)dx=0;
  if(minY+dy<150||maxY+dy>canvas.height-150)dy=0;
  slots.forEach(v=>{v.x+=dx;v.y+=dy});p.x+=dx;p.y+=dy;
 }else{
  p.x=Math.max(40,Math.min(canvas.width-40,p.x+dx));
  p.y=Math.max(70,Math.min(canvas.height-50,p.y+dy));
 }
 draw();
});
function save(type){const prev=selectedElement;selectedElement=null;draw();const ext=type==='image/png'?'png':'jpg',a=document.createElement('a');a.download=`커미션_쿠폰_${nameEl.value.trim()||'발행본'}.${ext}`;a.href=canvas.toDataURL(type,type==='image/jpeg'?.95:undefined);a.click();selectedElement=prev;draw()}
document.querySelector('#downloadPng').onclick=()=>save('image/png');document.querySelector('#downloadJpg').onclick=()=>save('image/jpeg');draw();
</script></body></html>
